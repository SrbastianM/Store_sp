webdriver {
  driver = chrome
  autodownload = true
}

serenity {
  project.name = "Store Screenplay Automation"
  take.screenshots = FOR_FAILURES
}

chrome {
  switches = ["--start-maximized", "--disable-notifications"]
}

timeouts {
  implicitlywait = 5000
  fluentwait = 10000
}

environments {
  qa {
    webdriver.base.url = "https://www.demoblaze.com/"
  }
}

serenity.logging = VERBOSE